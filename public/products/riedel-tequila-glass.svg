<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1500" width="640" height="1500">
  <!-- Placeholder illustration: Riedel-style tequila glass (TODO: replace with product photography) -->
  <defs>
    <linearGradient id="crystal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" x2="1" y1="0" y2="0">
