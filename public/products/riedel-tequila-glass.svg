    <ellipse cx="320" cy="612" rx="107" ry="10" fill="#ffe0a6" opacity="0.85"/>
    <rect x="236" y="640" width="10" height="150" fill="#fff" opacity="0.22"/>
  </g>

  <!-- bowl -->
  <path d="M210 80 C205 260 196 420 208 560 C220 700 262 790 320 800 C378 790 420 700 432 560 C444 420 435 260 430 80" fill="url(#crystal)" stroke="#fff" stroke-opacity="0.75" stroke-width="3"/>
  <ellipse cx="320" cy="80" rx="110" ry="14" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="3"/>
  <path d="M232 110 C228 300 224 430 236 560" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <path d="M410 140 C414 300 414 430 404 540" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/>

  <!-- stem -->
  <path d="M306 800 C310 860 312 1100 308 1330 L332 1330 C328 1100 330 860 334 800 Z" fill="url(#stem)" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M316 830 L316 1310" stroke="#fff" stroke-opacity="0.6" stroke-width="3"/>

  <!-- foot -->
  <ellipse cx="320" cy="1352" rx="170" ry="30" fill="url(#foot)" stroke="#fff" stroke-opacity="0.8" stroke-width="3"/>
  <path d="M168 1356 C220 1378 420 1378 472 1356" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="2"/>
