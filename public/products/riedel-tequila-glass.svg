      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="bowl">
      <path d="M210 80 C205 260 196 420 208 560 C220 700 262 790 320 800 C378 790 420 700 432 560 C444 420 435 260 430 80 Z"/>
    </clipPath>
  </defs>

  <!-- liquid -->
  <g clip-path="url(#bowl)">
